[enunciado]
titulo=Establecer preferenicas en secciones de un periódico
enunciado="
<ul>

<li>Mostramos un listado de noticias</li>
<ol>
<li>Economía</li>
<li>Deportes</li>
<li>Política</li>
  </ol>
<li>Por defecto las motramos todas</li>
<li>Dejamos un check para seleccionar las noticias que más nos interesan</li>
<li>Sólo se mostrarán esas y se guardará la preferencia </li>
<li>Sucesivas conexión se visualizará la preferencia</li>
<li>En caso de seleccionar todas se elminará la preferencia</li>
</ul>"
