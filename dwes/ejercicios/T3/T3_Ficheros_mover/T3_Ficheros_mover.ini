[datos]
listado="Mover ficheros"
tema="3.- Ficheros"

[enunciado]
titulo="Mover ficheros (cambiando el nombre="
enunciado="<div class='small'>
    <ul>
        <li>
            Un programa que nos permita mover ficheros
        </li>
        <li>
            Trabajaremos sobre un directorio llamado ficheros de nuestro proyecto<br >
            mostraremos un desplegable con todos los ficheros

        </li>
        <li>
            Tendremos una caja de texto para especificar el mismo nombre
        </li>
        <li>
            La acción la haremos sobre el mismo directorio
        </li>
        <ul>
            <li style="color:darkred">
                bool rename($origen,$destino);
            </li>
            <ol>
                <li><strong>$origen</strong> es el nombre original del fichero</li>
                <li><strong>$destino </strong>es el nuevo nombre que queremos poner</li>
                <li><strong>bool</strong> valor de retorno true o false según se haya realizado la acción </li>
            </ol>
        </ul>
    </ul>"
[ejecucion]
index="index.php"
revisado=no

