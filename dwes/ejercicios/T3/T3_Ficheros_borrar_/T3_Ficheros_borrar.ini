[datos]
listado="Borrar y crear ficheros"
tema="3.- Ficheros"

[enunciado]
titulo="Borrar y crear ficheros"
enunciado="<div class='small'>
    <ul>
        <li>
            Un programa que nos permita crear y borrar ficheros
        </li>
        <li>
            Trabajaremos sobre un directorio llamado ficheros de nuestro proyecto<br >
            mostraremos un desplegable con todos los ficheros

        </li>
        <li>
            <strong>Crear ficheros</strong> creará 20 ficheros aleatorios en esa carpeta<br />
            usa la función <strong>tempnam(...)</strong>

        </li>
        <li>
            <strong>Borrar ficheros</strong> borrará todos los ficheros de ese dierctorio<br />
            usa la función <strong>unlink(...)</strong>

        </li>
        <li>
            <strong>Borrar fichero seleciconado </strong> eliminará el fichero que seleccionemos
        </li>
        <ul>
            <li style="color:darkred">
                $name tempnam($directorio,$prefijo);
            </li>
            <ol>
                <li><strong>$directorio</strong> es el directorio dónde se creará el fichero aleatorio</li>
                <li><strong>$prefijo </strong>es un string que se pondrá delante del nombre aleatorio generado</li>
                <li><strong>$name</strong> es el nombre del fichero que se ha creado (false si no se ha podido crear)</li>
            </ol>
        </ul>
    </ul>"
[ejecucion]
index="index1.php"
revisado=si

