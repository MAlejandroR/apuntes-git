[enunciado]
titulo=Usa las funciones de leer de un fichero
enunciado="<div class='small'>
<ul><li>Partiendo de que tenemos un fichero llamado nombres.txt en el directorio actual</li>
<li>Lee su contenido usando las siguientes funciones</li>
<ol>
<li>fgets </li>
<li>fgetss </li>
<li>fread </li>
<li>file </li>
<li>file_get_content() </li>
</ol>
<li>Recuerda abir y cerrar el fichero</li>
<li>Funciones de ayuda</li>
<ol>
<li>filesize($nombre_fichero) retorna el tamaño en bytes del fichero</li>
<li>Las funciones  que trabajan con el puntero retornan nul si ya he llegado al final del fichero</li>
</ol>

</ul>"

