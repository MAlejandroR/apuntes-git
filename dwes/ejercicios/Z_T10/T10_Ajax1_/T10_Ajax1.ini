[datos]
listado=Actuliza texto con ajax
tema="10.- Ajax con Jaxon"

[enunciado]
titulo=Usando la librería de jaxon realiza una llamada ajax
enunciado="<h4>Actualiza un texto de un div de la página html</h4>
<ol>
    <li>Implementamos una aplicación con un texto en un div cuyo id se <strong>div_saluda</strong></li>
    <li>Dentro de ese div tendremos un texto que diga</li>
    <li>Este texto es el original de la página</li>
    <li>Tendremos un botón llamado <strong>acutaliza texto</strong></li>
    <li>al presionarlo cambiará el texto anterior por</li>
    <ul>
        <li><strong>texto actualizado por el servidor mediante llamada ajax, el resto de la página no se actualiza</strong></li>
    </ul>
</ol>"
[ejecucion]
index=index.php
revisado=si

