[enunciado]
titulo=Crerar una app de un ambulatorio
enunciado="<div class='small'>
Herencia: gestión personal ambulatorio<br />
Se pide gestionar un ambulatorio.<br />
Para ello vamos a hacer sólo el diagrama de clases y su implementación.<br />
Lo hacemos a nivel básico (sin entrar en detalles).<br />
Tras realizar un análisis se determina que se pretende gestionar:<br />
<li>  los datos de los empleados y anotar las acciones básicas que realizan.</li>
<li>Encontramos los siguientes elementos que especificamos como clases</li>
<ol>
<li>Conserjes</li>
<li>Enfermeras</li>
<li>Médicas</li>
</ol>
<img style="float:right"src=imagenes/ambulatorio.png>
"
