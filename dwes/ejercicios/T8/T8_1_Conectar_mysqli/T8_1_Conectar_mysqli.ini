<strom>Crea una base de datos en mysql</storm>
    <pre class='prettyprint' style="font-size:0.6em">
        create database usuarios;
        use usuarios;
        create table usuario(
              id int not null unique auto_inccremet,
              nombre varchar(40),
              password varchar(200),
        )
    </pre>
