
[datos]
listado=Acceso Restringido
tema="5.- Autentificación"

[enunciado]
titulo=Autentificación por apache con ficheros .htaccess
enunciado="
<link rel='stylesheet' href='estilo.css' type='text/css'>
<ol>
    <li>
        Crea un fichero de contraseñas llamado <span class="r">misUsuarios</span> con por ejemplo 5 usuarios (alicia, sara, jorge,
        paula, manolo)
    </li>
    <li>Crea un fichero de grupos con por 1 grupo (grupo_familia) al que pertenecerán sara, alicia y paula)
    </li>
    <li>
        Crea un sencillo sitio web que me redirija a 4 páginas:
    </li>
    <ol>
        <li>
            Información General: Tendrá acceso todo el mundo.
        </li>
        <li>
            Información restringida: Sólo tenrán acceso los usuarios creados en el fichero misUsuarios.
        </li>
        <li>
            Información Sara : Tendrá acceso solo el usuario sara.
        </li>
        <li>
            Información de grupo: Tendrá acceso los usuarios del grupo creado.

        </li>
    </ol>
    Cada página simplemente contredrá un texto de la página y nombre de acceso"

index=index.php
revisado=si
