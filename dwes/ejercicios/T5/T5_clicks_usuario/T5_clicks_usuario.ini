titulo=Cuenta el número de clicks que hacen los usuarios
enunciado="
<ul>

<li>Un formulario con una caja de texto</li>
<li>En ella el usuario/a inserta su nombre y cliquea el submit</li>
<li>Vamos guardando los clicks que hace cada usuario</li>
<li>Lo visualizamos</li>
    <ol>
        <li>Observa como se lee el usuario</li>
        <li>Se lee un array con todos los usuarios y sus clicks anteriores</li>
        <li>La primera vez ese array estará vacío</li>
        <li>Agregamos el nuevo usuario al array</li>
        <li>Guardamos el array en campos ocultos y así lo podremos leer posteriormente</li>
        <li></li>
    </ol>
</ul>"
