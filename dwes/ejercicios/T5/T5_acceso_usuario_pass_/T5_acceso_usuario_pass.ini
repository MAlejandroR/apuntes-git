titulo=Acceso de usuario y pass controlado por sesión.
enunciado="<span class="small" ><span class=bold>Dejamos solamente 3 intentos seguidos para acceder<br /></span>
<ul>
<li>Usuario y contraseña serán cualquiera con el mismo valor<br /></li>
<li> Si incorrecto Datos incorrectos, le quedan X intentos</li>
<li>Si ya lleva 3 intentos iremos a una página Acceso bloqueado</li>
<li>Si datos correctos vamos a sitio.php donde mostraremos un mensaje de bienvenida y el nombre .</li>
<li>Desde sito.php, será posible navegar a una tercera página llamada navegando.php</li>
<li>Se onde se mostrará otro mensaje con el nombre del usuario</li>
<li>Desde sito.php o navegando.php se podrá cerrar sesión, en cuyo caso deberemos de pasar a la primer página</li>
<li>Estas dos páginas solo deberá de ser posible acceder si nos hemos logueado"</li>
</ul>
</span>
